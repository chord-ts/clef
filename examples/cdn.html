<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clef — CDN example</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #docs {
        height: 100%;

    </script>
  </body>
</html>
