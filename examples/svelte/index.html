<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>clef — Svelte component example</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #app {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { mount } from 'svelte';
      import App from './App.svelte';
      mount(App, { target: document.getElementById('app') });
    </script>
  </body>
</html>
